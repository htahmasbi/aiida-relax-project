# aiida-relax-project Configuration
# This file contains default settings for calculations.
# Environment variables take precedence over these values.

# =============================================================================
# Default Settings
# =============================================================================

[default]
engine = "cp2k"
code_label = "rosi5"
max_wallclock_seconds = 86400
resource_preset = "default"

# =============================================================================
# VASP Settings
# =============================================================================

[vasp]
# Potential family for PAW pseudos
potential_family = "PBE.54"

# K-point mesh for reciprocal space integration
kpoints_mesh = [4, 4, 4]

# Default plane-wave cutoff (eV)
default_encut = 400

# Default ISIF for relaxation (3 = volume+shape+positions)
default_isif = 3

# Default IBRION for ion optimization (-1=none, 1=conjugate gradient, 2=quasi-Newton)
default_ibrion = 2

# Default potential mapping (element -> pseudo)
[vasp.potential_mapping]
Si = "Si"
B = "B"
N = "N"

# =============================================================================
# CP2K Settings
# =============================================================================

[cp2k]
# K-point mesh (typical for 2D BN slab: dense in-plane, sparse out-of-plane)
kpoints_mesh = [12, 1, 12]

# Default Gaussian plane-wave cutoff (Ry)
default_cutoff = 400

# Default SCF convergence threshold
default_eps_scf = 5.0e-7

# Maximum SCF iterations
default_max_scf = 500

# Default SCF initial guess (ATOMIC, RESTART, etc.)
scf_guess = "RESTART"

# CP2K-specific file names
basis_set_file = "BASIS_MOLOPT"
potential_file = "GTH_POTENTIALS"

# Per-element basis set mapping (element -> basis set name)
[cp2k.basis_set_mapping]
B = "aug-SZV-MOLOPT-GTH-tier-1"
N = "aug-SZV-MOLOPT-GTH-tier-1"

# Per-element potential mapping (element -> potential name)
# Use potentials with charge states for GW (e.g., GTH-PBE-q3 for B, GTH-PBE-q5 for N).
# For standard (non-GW) DFT, GTH-PBE (auto-detected charge) also works.
[cp2k.potential_mapping]
B = "GTH-PBE-q3"
N = "GTH-PBE-q5"

# Per-element RI auxiliary basis set mapping (for GW, TDDFT, etc.)
# These are the long RI basis names specific to each element's aug-SZV-MOLOPT-GTH-tier-1 ORB basis.
# Uncomment and set to enable RI-based post-HF methods.
# [cp2k.ri_basis_set_mapping]
# B = "RI_aug-SZV-MOLOPT-GTH-tier-1_N_RI_009_s_p_d_f_g_h_i_3_2_0_0_0_0_0_error_1.1e-06"
# N = "RI_aug-SZV-MOLOPT-GTH-tier-1_N_RI_025_s_p_d_f_g_h_i_6_3_2_0_0_0_0_error_2.9e-06"

# RI auxiliary basis set file (separate from the main basis set file).
# When set, both BASIS_SET_FILE_NAME lines are emitted.
# ri_basis_set_file = "/path/to/RI_BASIS"

# =============================================================================
# Relaxation Settings
# =============================================================================

[relax]
# Default relaxation type: volume, shape, positions, cell
relaxation_type = "volume"

# Maximum optimization steps
default_max_steps = 50

# Energy convergence threshold (eV)
default_energy_tolerance = 1.0e-5

# Force convergence threshold (eV/Ang)
default_force_tolerance = 0.01

# =============================================================================
# GW / Bandstructure Settings (CP2K only)
# =============================================================================

[gw]
# Paths to augmented basis sets and potentials (update for your system)
basis_set_file = "/path/to/BASIS_GTH_MOLOPT_AUG_for_excited_states"
ri_basis_set_file = "/path/to/BASIS_GTH_MOLOPT_AUG_for_excited_states_RI"
potential_file = "/path/to/POTENTIAL_UZH"

# Target relative accuracy for RI basis selection (e.g. 1e-5, 1e-6).
# When set, auto_resolve picks the best RI basis not exceeding this value.
ri_basis_accuracy_target = 1e-5

# K-point density (effective k-points per primitive lattice vector).
# The actual mesh is computed as mesh_i = max(1, round(density / supercell_i)).
# For supercell [3,3,1], density=36 gives [12, 1, 12].
# Set kpoints_mesh / kpoints_w explicitly below to override.

kpoint_density = 36

# K-point meshes
#kpoints_mesh = [12, 1, 12]
#kpoints_w = [12, 1, 12]


# Cutoffs and tolerances
cutoff = 400
rel_cutoff = 50
eps_default = 1.0e-12
eps_pgf_orb = 1.0e-12
eps_scf = 5.0e-7
max_scf = 500

# Periodicity for 2D materials (XZ = periodic in x,z, vacuum in y)
periodic = "XZ"
poisson_solver = "WAVELET"

# Vacuum gap (A) along the non-periodic direction after rotation
vacuum = 20.0

# Supercell scaling for the in-plane directions (e.g. [3, 3, 1], [2, 2, 1], etc.)
supercell = [3, 3, 1]

# SCF mixing
mixing_alpha = 0.2
mixing_beta = 0.8
mixing_nbroyden = 10

# GW parameters
num_time_freq = 10
memory_per_proc = 600
eps_filter = 1.0e-6
cutoff_radius_ri = 5
regularization_ri = 0.01

# Basis sets and potentials per element
orb_basis = "aug-SZV-MOLOPT-GTH-tier-1"

# Per-element RI basis and potential (default: B and N from code).
# Add entries for any new elements you need, e.g.:
#
# [gw.element_settings.C]
# ri_basis = "RI_..."
# potential = "GTH-PBE-q4"
#
# [gw.element_settings.Si]
# ri_basis = "RI_..."
# potential = "GTH-PBE-q4"
#
# [gw.element_settings.O]
# ri_basis = "RI_..."
# potential = "GTH-PBE-q6"

# Alternatively, set auto_resolve = true to read element name mappings
# directly from the three file paths (files must be locally accessible):
auto_resolve = true

# Number of k-points per bandstructure segment
bs_npoints = 20

# Bandstructure path is auto-computed from the structure's space group
# via pymatgen's HighSymmKpath.  To override for a specific material,
# uncomment and set special_points below:
# special_points = [
#     "GAMMA  0.0  0.0  0.0",
#     "M      0.5  0.0  0.0",
#     "K      0.3333  0.0  0.3333",
#     "GAMMA  0.0  0.0  0.0",
# ]

# =============================================================================
# Volume Scan Settings
# =============================================================================

[volume_scan]
# Maximum number of structures to process
max_structures = 5

# Continue processing if some calculations fail
continue_on_failure = false

# Default group label for new structure groups
default_group = "default_scan_group"

# =============================================================================
# Generic Parameters (used with --generic flag)
# =============================================================================

[generic]
# Default plane-wave cutoff
encut = 400

# Default optimization steps
max_steps = 50

# Default energy tolerance
energy_tolerance = 1.0e-5

# Default exchange-correlation functional
xc_functional = "PBE"

# Default SCF initial guess
scf_guess = "ATOMIC"

# =============================================================================
# Raw Parameters — add any engine-specific setting without modifying code
# Uncomment and adjust the sections you need.
# These are deep-merged on top of the programmatic defaults.
# =============================================================================

# ---------------------------------------------------------------------------
# VASP raw_incar: extra INCAR flags merged into the final INCAR dict
# ---------------------------------------------------------------------------
# [vasp.raw_incar]
# LORBIT = 11
# ISMEAR = -5
# SIGMA = 0.05

# ---------------------------------------------------------------------------
# CP2K raw_parameters: any nested CP2K input section
#
# When using modules (ml cp2k/master), BASIS_MOLOPT and GTH_POTENTIALS
# are typically resolved automatically. You only need these if you use
# custom paths (e.g., augmented basis sets for GW) or GW-specific settings.
#
# TWO-STEP WORKFLOW FOR GW:
#   1. Standard SCF (no GW) to get a wavefunction restart file
#   2. GW single-point with SCF_GUESS RESTART and PROPERTIES/GW section
#
# Below is the complete raw_parameters block matching the working
# GW input for 2D BN (aug-SZV-MOLOPT-GTH-tier-1 basis).
# ---------------------------------------------------------------------------
# Uncomment and adapt to your system:
#
# [cp2k.raw_parameters.GLOBAL]
# PROJECT = "GW-2D"
#
# [cp2k.raw_parameters.FORCE_EVAL.DFT]
# SORT_BASIS = "EXP"
#
# [cp2k.raw_parameters.FORCE_EVAL.DFT.QS]
# EPS_DEFAULT = 1.0e-12
# EPS_PGF_ORB = 1.0e-12
#
# [cp2k.raw_parameters.FORCE_EVAL.DFT.MGRID]
# REL_CUTOFF = 50
#
# [cp2k.raw_parameters.FORCE_EVAL.DFT.SCF]
# SCF_GUESS = "RESTART"
#
# [cp2k.raw_parameters.FORCE_EVAL.DFT.SCF.MIXING]
# METHOD = "BROYDEN_MIXING"
# ALPHA = 0.2
# BETA = 0.8
# NBROYDEN = 10
#
# [cp2k.raw_parameters.FORCE_EVAL.DFT.SCF.PRINT]
# [cp2k.raw_parameters.FORCE_EVAL.DFT.SCF.PRINT.RESTART]
# _ = "ON"
#
# ---------------------------------------------------------------------------
# GW / Bandstructure — add to the same raw_parameters block
# ---------------------------------------------------------------------------
# [cp2k.raw_parameters.FORCE_EVAL.PROPERTIES]
# [cp2k.raw_parameters.FORCE_EVAL.PROPERTIES.BANDSTRUCTURE]
# [cp2k.raw_parameters.FORCE_EVAL.PROPERTIES.BANDSTRUCTURE.DOS]
#
# [cp2k.raw_parameters.FORCE_EVAL.PROPERTIES.BANDSTRUCTURE.GW]
# NUM_TIME_FREQ_POINTS = 10
# MEMORY_PER_PROC = 300
# EPS_FILTER = 1.0e-6
# CUTOFF_RADIUS_RI = 5
# REGULARIZATION_RI = 0.01
# KPOINTS_W = [24, 1, 24]
#
# [cp2k.raw_parameters.FORCE_EVAL.PROPERTIES.BANDSTRUCTURE.BANDSTRUCTURE_PATH]
# NPOINTS = 20
# UNITS = "B_VECTOR"
# SPECIAL_POINT = ["GAMMA  0.0  0.0  0.0",
#                  "M      0.5  0.0  0.0",
#                  "K      0.3333  0.0  0.3333",
#                  "GAMMA  0.0  0.0  0.0"]
#
# ---------------------------------------------------------------------------
# PERIODIC XZ (for 2D materials with vacuum in Y)
# ---------------------------------------------------------------------------
# [cp2k.raw_parameters.FORCE_EVAL.DFT.POISSON]
# PERIODIC = "XZ"
# POISSON_SOLVER = "WAVELET"
