# =============================================================================
# CP2K CONFIGURATION - Modify all required fields for your system
# =============================================================================

engine: cp2k
description: "CP2K single-point calculation"

optimade:
  endpoint: https://optimade.materialscloud.org/main/mc2d/v1/structures
  filter: 'elements HAS ALL "B","N" AND nelements=2'
  max_structures: 10
  page_limit: 100

structure_group: null

structure: null

transformations:
  rotate_xy_to_xz: true
  vacuum: 20.0
  make_supercell: [3, 3, 1]

kpoints_mesh: [4, 1, 4]

cp2k:
  code_label: cp2k@localhost
  basis_file: BASIS_MOLOPT
  potential_file: GTH_POTENTIALS
  kinds:
    - element: B
      basis_set: DZVP-MOLOPT-SR-GTH-q3
      potential: GTH-PBE-q3
    - element: N
      basis_set: DZVP-MOLOPT-SR-GTH-q5
      potential: GTH-PBE-q5
  parameters:
    CUTOFF: 400
    EPS_SCF: 1e-6
    MAX_SCF: 200
    RUN_TYPE: ENERGY
    CHARGE: 0
    MULTIPLICITY: 1

resources:
  num_machines: 1
  num_mpiprocs_per_machine: 16
  withmpi: true

max_wallclock_seconds: 3600

output:
  store_structures: true
  save_cif: false
  group_label: mc2d_cp2k_results