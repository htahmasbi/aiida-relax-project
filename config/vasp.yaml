# =============================================================================
# VASP CONFIGURATION - Modify all required fields for your system
# =============================================================================

engine: vasp
description: "VASP single-point calculation"

optimade:
  endpoint: https://optimade.materialscloud.org/main/mc2d/v1/structures
  filter: null
  max_structures: null
  page_limit: 100

structure_group: null

structure: null

transformations:
  rotate_xy_to_xz: false
  vacuum: 20.0
  make_supercell: null

kpoints_mesh: [4, 4, 4]

vasp:
  code_label: vasp@localhost
  potential_family: PBE.54
  potential_mapping:
    Si: Si
  parameters:
    ENCUT: 400
    PREC: Normal
    EDIFF: 1e-5
    ISMEAR: 0
    SIGMA: 0.05
    NSW: 0

resources:
  num_machines: 1
  num_mpiprocs_per_machine: 8
  withmpi: true

max_wallclock_seconds: 3600

output:
  store_structures: false
  save_cif: false
  group_label: null