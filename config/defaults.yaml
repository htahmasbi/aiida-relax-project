optimade:
  endpoint: https://optimade.materialscloud.org/main/mc2d/v1/structures
  page_limit: 100

transformations:
  rotate_xy_to_xz: false
  vacuum: 20.0
  make_supercell: null

resources:
  num_machines: 1
  num_mpiprocs_per_machine: 8
  withmpi: true

max_wallclock_seconds: 3600

output:
  store_structures: false
  save_cif: false
  group_label: null