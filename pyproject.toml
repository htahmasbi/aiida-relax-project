[project]
name = "aiida-relax-project"
version = "0.2.0"
description = "Unified AiiDA workflows for VASP and CP2K calculations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "aiida-relax-project contributors"},
]
keywords = ["aiida", "vasp", "cp2k", "dft", "workflow", "workflows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "aiida-core>=2.5.0",
    "aiida-vasp>=0.4.0",
    "aiida-cp2k>=0.4.0",
    "ase>=3.22.0",
    "pymatgen>=2023.10.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
aiida-relax = "aiida_relax_project.cli:app"

[project.urls]
Homepage = "https://github.com/htahmasbi/aiida-relax-project"
Documentation = "https://github.com/htahmasbi/aiida-relax-project#readme"
Repository = "https://github.com/htahmasbi/aiida-relax-project"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiida_relax_project*"]
exclude = ["launch_scripts*", "data_generation*", "tests*"]

[tool.setuptools.package-data]
aiida_relax_project = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiida.*"
ignore = true

[[tool.mypy.overrides]]
module = "ase.*"
ignore = true

[[tool.mypy.overrides]]
module = "pymatgen.*"
ignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["aiida_relax_project"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "launch_scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]